pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.13'
    displayName: 'Install Node.js'

  - script: |
      npm run setup
    displayName: 'Install api and app dependencies'

  - script: |
      cd client && npm run lint
    displayName: 'Lint app'

  - script: |
      cd client && npm run build
    displayName: 'Build app'
